name: Weekly Riley & Coe tracker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run BBC ingest (with diagnostics)
        run: |
          python scripts/ingest_tracks.py

      - name: Run RadioFiles collector
        run: |
          python scripts/collect_radiofiles.py

      - name: Run Mixcloud collector
        run: |
          python scripts/collect_mixcloud.py

      - name: Generate coverage report
        run: |
          python scripts/generate_coverage_report.py

      - name: Upload diagnostics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: riley-coe-diagnostics
          path: |
            diagnostics/**
            outputs/**
            reports/**
