name: Weekly Riley & Coe tracker

on:
  push:
    branches: [ main ]
  schedule:
    # Monday 09:00 GMT
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Add artist pool from Riley & Coe episodes (best-effort, no secrets required)
        env:
          INITIAL_RUN: 'true'
        run: |
          python scripts/ingest_tracks.py

      - name: Fetch matching gig data
        run: |
          python scripts/fetch_events.py

      - name: Commit updated files
        run: |
          git config user.name "riley-coe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artists.json matches/ || true
          if ! git diff --cached --quiet; then
            git commit -m "Update artists and matches"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Create issue summary if matches exist
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'matches/' + new Date().toISOString().slice(0,10) + '.json';
            if (!fs.existsSync(path)) {
              console.log('No matches file found yet for today: ' + path);
              return;
            }
            const matches = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(matches) || matches.length === 0) {
              console.log('No matches to publish');
              return;
            }
            const lines = ['# Riley & Coe weekly matches', '', '## Matches found', ''];
            for (const m of matches) {
              const date = m.date || 'TBA';
              const price = m.price || 'N/A';
              const url = m.url ? `([link](${m.url}))` : '';
              lines.push(`- ${date} | ${m.artist} | ${m.venue} | ${price} ${url}`);
            }
            lines.push('', 'The detailed report is stored in `matches/' + new Date().toISOString().slice(0,10) + '.json`');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Riley & Coe matches for ${new Date().toISOString().slice(0,10)}`,
              body: lines.join('\n')
            });
